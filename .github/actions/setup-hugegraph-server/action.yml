name: Setup HugeGraph Server
description: Prepare an immutable release or candidate fixture, or start an independent test service
inputs:
  mode:
    description: 'standalone (legacy), build (upload), or start (download)'
    default: standalone
  artifact-name:
    description: Workflow-local immutable fixture artifact name
    default: ''
  repository:
    description: Server source repository (Java 11 release requires apache/hugegraph)
    default: apache/hugegraph
  fetch-ref:
    description: Fetchable source ref (must resolve to commit-id)
    default: ''
  commit-id:
    description: Exact Server commit SHA (Java 11 release requires the locked 1.7.0 commit)
    required: true
  java-version:
    description: JDK major used for the build and runtime
    default: '11'
  release-version:
    description: Fixed official Server release used by Java 11 compatibility fixtures
    default: '1.7.0'
  java-home:
    description: Optional fixture JDK scoped to this subprocess; keeps Toolchain JDK unchanged
    default: ''
  isolate-maven-repo:
    description: Build fixtures without replacing Toolchain Maven dependencies
    default: 'false'
  export-candidate-sdk:
    description: Retain the verified candidate SDK with the shared Server fixture
    default: 'false'
  local-fixture-dir:
    description: Already downloaded fixture directory; start mode only
    default: ''
  travis-dir:
    description: Module service setup directory
    default: hugegraph-loader/assembly/travis
runs:
  using: composite
  steps:
    - name: Download shared Server fixture
      if: inputs.mode == 'start' && inputs.local-fixture-dir == ''
      uses: actions/download-artifact@v4
      with:
        name: ${{ inputs.artifact-name }}
        path: ${{ runner.temp }}/hugegraph-fixture
    - name: Identify fixture build inputs
      id: fixture-identity
      shell: bash
      env:
        EXPORT_SDK: ${{ inputs.export-candidate-sdk }}
        FIXTURE_JAVA_HOME: ${{ inputs.java-home }}
      run: |
        set -euo pipefail
        helper="$GITHUB_WORKSPACE/hugegraph-client/assembly/travis/manifest.py"
        inputs=$(python3 "$helper" inputs)
        printf 'inputs=%s\n' "$inputs" >> "$GITHUB_OUTPUT"
        if [[ "$EXPORT_SDK" == true ]]; then
          if [[ -n "$FIXTURE_JAVA_HOME" ]]; then
            export JAVA_HOME="$FIXTURE_JAVA_HOME"
            export PATH="$JAVA_HOME/bin:$PATH"
          fi
          sdk_identity=$(python3 "$helper" sdk-identity)
          printf 'sdk=%s\n' "$sdk_identity" >> "$GITHUB_OUTPUT"
        fi
    - name: Restore exact Server fixture cache
      if: inputs.mode == 'build' && inputs.export-candidate-sdk != 'true'
      uses: actions/cache@v4
      with:
        path: ~/hugegraph-fixture-cache
        key: server-fixture-v3-${{ runner.os }}-${{ runner.arch }}-${{ inputs.repository }}-${{ inputs.commit-id }}-release${{ inputs.release-version }}-jdk${{ inputs.java-version }}-${{ steps.fixture-identity.outputs.inputs }}
    - name: Restore exact SDK and Server fixture cache
      if: inputs.mode == 'build' && inputs.export-candidate-sdk == 'true'
      id: sdk-cache
      uses: actions/cache@v4
      with:
        path: ~/hugegraph-fixture-cache
        key: sdk-server-fixture-v1-${{ runner.os }}-${{ runner.arch }}-${{ inputs.repository }}-${{ inputs.commit-id }}-${{ steps.fixture-identity.outputs.sdk }}
    - name: Prepare fixture or start service
      shell: bash
      env:
        FIXTURE_MODE: ${{ inputs.mode }}
        FIXTURE_EXPORT_CANDIDATE_SDK: ${{ inputs.export-candidate-sdk }}
        FIXTURE_SDK_CACHE_HIT: ${{ steps.sdk-cache.outputs.cache-hit }}
        LOCAL_FIXTURE_DIR: ${{ inputs.local-fixture-dir }}
        FIXTURE_REPOSITORY: ${{ inputs.repository }}
        FIXTURE_COMMIT: ${{ inputs.commit-id }}
        FIXTURE_REF: ${{ inputs.fetch-ref }}
        FIXTURE_BUILD_INPUTS: ${{ steps.fixture-identity.outputs.inputs }}
        FIXTURE_PLATFORM: ${{ runner.os }}-${{ runner.arch }}
        FIXTURE_JAVA: ${{ inputs.java-version }}
        FIXTURE_RELEASE_VERSION: ${{ inputs.release-version }}
        FIXTURE_JAVA_HOME: ${{ inputs.java-home }}
        ISOLATE_FIXTURE_REPO: ${{ inputs.isolate-maven-repo }}
        FIXTURE_DIR: ${{ runner.temp }}/hugegraph-fixture
        SERVER_REPOSITORY: ${{ inputs.repository }}
        SERVER_FETCH_REF: ${{ inputs.fetch-ref }}
        TRAVIS_DIR: ${{ inputs.travis-dir }}
        FIXTURE_ACTION: ${{ github.workspace }}/hugegraph-client/assembly/travis
        FIXTURE_ARTIFACT: ${{ inputs.artifact-name }}
      run: |
        set -euo pipefail
        if [[ -n "$FIXTURE_JAVA_HOME" ]]; then
          [[ -x "$FIXTURE_JAVA_HOME/bin/java" && -x "$FIXTURE_JAVA_HOME/bin/javac" ]]
          export JAVA_HOME="$FIXTURE_JAVA_HOME"
          export PATH="$JAVA_HOME/bin:$PATH"
        fi
        if [[ -n "${LOCAL_FIXTURE_DIR:-}" ]]; then
          [[ "$FIXTURE_MODE" == start && -d "$LOCAL_FIXTURE_DIR" && ! -L "$LOCAL_FIXTURE_DIR" ]]
          export FIXTURE_DIR="$LOCAL_FIXTURE_DIR"
        fi
        if [[ "$ISOLATE_FIXTURE_REPO" == true && "$FIXTURE_MODE" != start ]]; then
          fixture_repo=$(mktemp -d "$RUNNER_TEMP/hugegraph-fixture-m2.XXXXXX")
          export MAVEN_ARGS="${MAVEN_ARGS:-} -Dmaven.repo.local=$fixture_repo"
          export MAVEN_OPTS="${MAVEN_OPTS:-} -Dmaven.repo.local=$fixture_repo"
        fi
        if [[ "$FIXTURE_MODE" != standalone && -z "$FIXTURE_ARTIFACT" ]]; then
          echo 'artifact-name is required for build/start mode' >&2
          exit 1
        fi
        if [[ "$FIXTURE_MODE" == build ]]; then
          bash "$FIXTURE_ACTION/fixture.sh"
        else
          # Keep downloaded archives and legacy source checkouts out of the caller's tree.
          TRAVIS_DIR=$(cd "$TRAVIS_DIR" && pwd)
          export TRAVIS_DIR
          server_build=$(mktemp -d "${RUNNER_TEMP:-${TMPDIR:-/tmp}}/hugegraph-build.XXXXXX")
          cd "$server_build"
          if [[ "$FIXTURE_MODE" == standalone ]]; then
            FIXTURE_MODE=build bash "$FIXTURE_ACTION/fixture.sh"
            export FIXTURE_MODE=start
          fi
          if [[ -f "$TRAVIS_DIR/install-hugegraph-from-source.sh" ]]; then
            bash "$TRAVIS_DIR/install-hugegraph-from-source.sh" "$FIXTURE_COMMIT"
          else
            bash "$TRAVIS_DIR/install-hugegraph.sh" "$FIXTURE_COMMIT" "$FIXTURE_REF"
          fi
        fi
    - name: Upload shared Server fixture
      if: inputs.mode == 'build'
      uses: actions/upload-artifact@v4
      with:
        name: ${{ inputs.artifact-name }}
        path: |
          ${{ runner.temp }}/hugegraph-fixture/server.tar.gz
          ${{ runner.temp }}/hugegraph-fixture/manifest.json
          ${{ inputs.export-candidate-sdk == 'true' && format('{0}/hugegraph-fixture/sdk', runner.temp) || '' }}
        if-no-files-found: error
        retention-days: 7
