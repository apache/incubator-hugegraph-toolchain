name: "flink-cdc-java17-ci"

on:
  workflow_dispatch:
  pull_request:
    paths:
      - hugegraph-loader/**
      - hugegraph-client/**
      - pom.xml
      - .github/workflows/flink-cdc-ci.yml
      - .github/actions/get-hugegraph-commit/**
      - .github/actions/setup-candidate-sdk/**
  push:
    branches: [master, 'release-*']
    paths:
      - hugegraph-loader/**
      - hugegraph-client/**
      - pom.xml
      - .github/workflows/flink-cdc-ci.yml
      - .github/actions/get-hugegraph-commit/**
      - .github/actions/setup-candidate-sdk/**

permissions:
  contents: read

# Keep the newest PR run; preserve independent push, release and manual runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  packaged-cdc-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      MAVEN_OPTS: -Xmx768m -XX:ActiveProcessorCount=2
      FLINK_VERSION: '2.2.1'
      CDC_VERSION: '3.6.0-2.2'
    steps:
      - uses: actions/checkout@v7

      - name: Prepare Java 17
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: '17'

      - name: Install locked same-source candidate SDK
        id: candidate-sdk
        uses: ./.github/actions/setup-candidate-sdk

      - name: Validate acceptance tooling
        run: |
          node --test hugegraph-loader/src/test/scripts/flink-launcher.test.cjs
          python3 -m unittest discover -s hugegraph-loader/assembly/travis/flink-cdc -p 'test_*.py'
          python3 hugegraph-loader/assembly/travis/flink-cdc/verify.py

      - name: Build actual Loader distribution job
        run: |
          mvn package -pl hugegraph-client,hugegraph-loader -am -DskipTests -Dmaven.javadoc.skip=true \
            -Dflink.version="$FLINK_VERSION" -Dflinkcdc.version="$CDC_VERSION" -ntp
          mvn test checkstyle:check -pl hugegraph-client,hugegraph-loader -am -DforkCount=0 \
            -Dtest=FlinkSinkSerializationTest,HugeGraphSinkTest,HugeGraphDeserializationTest \
            -Dsurefire.failIfNoSpecifiedTests=false \
            -Dflink.version="$FLINK_VERSION" -Dflinkcdc.version="$CDC_VERSION" -ntp

      - name: Obtain external test-only JDBC driver
        run: |
          mkdir -p "$RUNNER_TEMP/flink-test-drivers"
          curl --fail --location --retry 3 \
            https://repo.maven.apache.org/maven2/mysql/mysql-connector-java/8.0.28/mysql-connector-java-8.0.28.jar \
            --output "$RUNNER_TEMP/flink-test-drivers/mysql-connector-java-8.0.28.jar"
          # The harness verifies its pinned SHA-256 before starting any runtime.

      - name: Link packaged CDC coordinator against the actual Flink runtime
        run: |
          jobs=(hugegraph-loader/target/*-shaded.jar)
          [[ ${#jobs[@]} -eq 1 && -f "${jobs[0]}" ]]
          docker run --rm --network none --memory 512m --entrypoint java \
            -v "$PWD/${jobs[0]}:/job.jar:ro" \
            -v "$PWD/hugegraph-loader/target/test-classes:/probe:ro" \
            "flink:${FLINK_VERSION}-java17" -Xmx256m -XX:ActiveProcessorCount=2 -cp /probe \
            org.apache.hugegraph.loader.flink.PackagedCdcClassLoadingProbe /job.jar /opt/flink/lib

      - name: Verify packaged CDC snapshot and recovery
        env:
          SERVER_COMMIT: ${{ steps.candidate-sdk.outputs.commit_id }}
          CANDIDATE_ARCHIVE: ${{ steps.candidate-sdk.outputs.archive }}
          CANDIDATE_ARCHIVE_SHA256: ${{ steps.candidate-sdk.outputs.archive-sha256 }}
          CANDIDATE_SDK_MANIFEST: ${{ steps.candidate-sdk.outputs.manifest }}
          CANDIDATE_MAVEN_REPO: ${{ steps.candidate-sdk.outputs.maven-repo }}
        run: |
          jobs=(hugegraph-loader/target/*-shaded.jar)
          [[ -f "$CANDIDATE_ARCHIVE" && -f "$CANDIDATE_SDK_MANIFEST" ]]
          [[ ${#jobs[@]} -eq 1 && -f "${jobs[0]}" ]]
          python3 hugegraph-loader/assembly/travis/flink-cdc/verify.py --run \
            --server-archive "$CANDIDATE_ARCHIVE" --job-jar "${jobs[0]}" \
            --server-archive-sha256 "$CANDIDATE_ARCHIVE_SHA256" --sdk-manifest "$CANDIDATE_SDK_MANIFEST" \
            --maven-repo "$CANDIDATE_MAVEN_REPO" \
            --jdbc-driver "$RUNNER_TEMP/flink-test-drivers/mysql-connector-java-8.0.28.jar" \
            --server-sha "$SERVER_COMMIT" --toolchain-sha "$(git rev-parse HEAD)" \
            --work-root "$RUNNER_TEMP" --evidence "$RUNNER_TEMP/flink-cdc-evidence"

      - name: Upload non-sensitive runtime evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: flink-cdc-java17-evidence
          path: ${{ runner.temp }}/flink-cdc-evidence
          if-no-files-found: warn
