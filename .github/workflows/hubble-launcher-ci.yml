name: Hubble launcher tests

on:
  workflow_call:

permissions:
  contents: read

jobs:
  launcher-tests:
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Exercise launcher process identity guards
        run: python3 hugegraph-hubble/hubble-dist/assembly/travis/test_hubble_launchers.py -v
      - name: Exercise isolated Vermeer development file boundaries
        if: runner.os == 'Linux'
        run: python3 hugegraph-hubble/hubble-dist/assembly/travis/test_vermeer_dev.py -v
