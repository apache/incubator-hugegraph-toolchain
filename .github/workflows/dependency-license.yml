name: Dependency inventory audit

on:
  workflow_call:

permissions:
  contents: read

jobs:
  check-dependency-license:
    runs-on: ubuntu-latest
    env:
      SCRIPT_DEPENDENCY: hugegraph-dist/scripts/dependency
      MAVEN_OPTS: -Xmx3g -XX:MaxMetaspaceSize=768m
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - name: Checkout source
        uses: actions/checkout@v7
      - name: Set up JDK 17
        uses: ./.github/actions/setup-java-env
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Use pinned Hubble Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: hugegraph-hubble/hubble-fe/.node-version
      - name: Activate pinned pnpm
        id: pnpm
        working-directory: hugegraph-hubble/hubble-fe
        run: |
          corepack enable
          pnpm --version
          echo "store=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
          echo "version=$(node -p 'require("./package.json").packageManager')" >> "$GITHUB_OUTPUT"
          echo "node=$(node --version)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm downloads
        uses: actions/cache@v6
        with:
          path: ${{ steps.pnpm.outputs.store }}
          key: ${{ runner.os }}-${{ runner.arch }}-${{ steps.pnpm.outputs.node }}-${{ steps.pnpm.outputs.version }}-${{ hashFiles('hugegraph-hubble/hubble-fe/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-${{ steps.pnpm.outputs.node }}-${{ steps.pnpm.outputs.version }}-

      - name: Install locked candidate SDK
        uses: ./.github/actions/setup-candidate-sdk

      - name: mvn install
        run: |
          mvn install -DskipTests=true -ntp
      - name: generate current dependencies
        run: |
          bash "$SCRIPT_DEPENDENCY/regenerate_known_dependencies.sh" current-dependencies.txt
      - name: check third dependencies
        run: |
          bash "$SCRIPT_DEPENDENCY/check_dependencies.sh"

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: 'Checkout Repository'
        uses: actions/checkout@v7
      - name: 'Dependency Review'
        uses: actions/dependency-review-action@v5.0.0
